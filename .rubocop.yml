plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 120

# The sorting algorithms are written as plain loops over indices to stay close to their textbook form, which the
# size and complexity cops penalise. Tests are long and repetitive by nature.
Metrics:
  Exclude:
    - lib/array_sort/algorithms/*.rb
    - test/**/*
    - script/generate_sig.rb
Metrics/AbcSize:
  Max: 21
  Exclude:
    - lib/array_sort/algorithms/*.rb
    - test/**/*
    - script/generate_sig.rb
Metrics/MethodLength:
  Max: 15
  Exclude:
    - lib/array_sort/algorithms/*.rb
    - test/**/*
    - script/generate_sig.rb

Minitest/MultipleAssertions:
  Max: 6

Naming/FileName:
  Exclude:
    - array-sort.gemspec
Naming/MethodParameterName:
  AllowedNames: [a, b, c, i, j, k]

# Short names like a, b and k are conventional in sorting code.
Naming/BlockParameterName:
  AllowedNames: [a, b, i, k]

Metrics/ParameterLists:
  CountKeywordArgs: false

# ArraySort is documented once, in lib/array_sort.rb, not in every file that reopens it. Test classes and the test
# modules document themselves.
Style/Documentation:
  AllowedConstants: [ArraySort]
  Exclude:
    - test/**/*
